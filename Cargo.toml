[workspace]
resolver = "3"
members = [
    "crates/airx-core",
    "crates/airx-protocol",
    "crates/airx-transport",
    "crates/airx"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wwog/airx"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bytes = "1"
http = "1"
futures-core = "0.3"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", default-features = false }
dotenvy = "0.15"

# HTTP 后端（仅 airx-transport 使用；TLS 由 feature 选择）
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
] }

# WASM 后端（仅 airx-transport 使用）
gloo-net = { version = "0.8.0", default-features = false, features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-streams = "0.7"
web-sys = { version = "0.3", default-features = false, features = [
    "ReadableStream",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

# 各 crate 尚未全部落地，依赖按白名单预先声明；
# 对应模块实现后移除本段，让 lint 恢复拦截真实的无用依赖。
[workspace.lints.cargo]
unused_dependencies = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
