[package]
name = "airx"
description = "airx 门面：Client / Builder / typed endpoint / prelude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["native", "rustls-tls", "openai", "stream"]

# 平台后端
native = ["airx-transport/native"]
rustls-tls = ["airx-transport/rustls-tls"]
native-tls = ["airx-transport/native-tls"]
wasm = ["airx-transport/wasm"]

# Provider
openai = ["airx-protocol/openai", "airx-unified?/openai"]
anthropic = ["airx-protocol/anthropic", "airx-unified?/anthropic"]
deepseek = ["airx-protocol/deepseek", "airx-unified?/deepseek"]
all-providers = ["openai", "anthropic", "deepseek"]

# 能力
stream = ["airx-core/stream", "airx-protocol/stream", "airx-transport/stream"]
json = ["airx-core/json"]
unified = ["dep:airx-unified"]

[dependencies]
airx-core = { path = "../airx-core", default-features = false }
airx-protocol = { path = "../airx-protocol", default-features = false }
airx-transport = { path = "../airx-transport", default-features = false }
airx-unified = { path = "../airx-unified", optional = true }
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
bytes.workspace = true
dotenvy.workspace = true

[[example]]
name = "chat"
required-features = ["openai"]

[[example]]
name = "chat_stream"
required-features = ["openai", "stream"]

[[example]]
name = "unified"
required-features = ["unified", "openai"]

[[example]]
name = "opencode_text"
required-features = ["openai"]

[[example]]
name = "opencode_stream"
required-features = ["openai", "stream"]

[[example]]
name = "opencode_retry"
required-features = ["openai", "native"]

[[example]]
name = "opencode_full"
required-features = ["openai", "unified"]
