[package]
name = "airx"
description = "airx 门面：Client / Builder / typed endpoint / prelude"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# 默认开箱即用：原生 HTTP + rustls + 全部 Provider + 流式。
# 需要裁剪时使用 default-features = false 按需选择。
default = ["native", "rustls-tls", "compression", "all-providers", "stream"]

# 平台后端
native = ["airx-transport/native"]
rustls-tls = ["airx-transport/rustls-tls"]
native-tls = ["airx-transport/native-tls"]
compression = ["airx-transport/compression"]
wasm = ["airx-transport/wasm"]

# Provider
openai = ["airx-protocol/openai"]
anthropic = ["airx-protocol/anthropic"]
gemini = ["airx-protocol/gemini"]
all-providers = ["openai", "anthropic", "gemini"]

# 能力
stream = ["airx-core/stream", "airx-protocol/stream", "airx-transport/stream"]
# 可选：把日志转发到 tracing（scope 映射为 target，如 `airx::net`）
tracing = ["airx-core/tracing"]

[dependencies]
airx-core = { version = "0.1.1", path = "../airx-core", default-features = false }
airx-protocol = { version = "0.1.1", path = "../airx-protocol", default-features = false }
airx-transport = { version = "0.1.1", path = "../airx-transport", default-features = false }
futures-core.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
dotenvy.workspace = true

[[example]]
name = "chat"
required-features = ["openai"]

[[example]]
name = "chat_stream"
required-features = ["openai", "stream"]

[[example]]
name = "gemini"
required-features = ["gemini"]

[[example]]
name = "gemini_stream"
required-features = ["gemini", "stream"]

[[example]]
name = "opencode_text"
required-features = ["openai"]

[[example]]
name = "opencode_stream"
required-features = ["openai", "stream"]

[[example]]
name = "opencode_retry"
required-features = ["openai", "native"]

[[example]]
name = "opencode_full"
required-features = ["openai"]

[[example]]
name = "deepseek_json"
required-features = ["openai"]

[[example]]
name = "logging"
required-features = ["openai"]
