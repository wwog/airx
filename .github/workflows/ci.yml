name: CI

on:
  push:
  pull_request:

env:
  ALL_FEATURES: airx/anthropic,airx/deepseek,airx/unified

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features "$ALL_FEATURES" -- -D warnings

      - name: Test
        run: cargo test --workspace --features "$ALL_FEATURES"

      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --features "$ALL_FEATURES"

      - name: Dependency direction
        run: ./scripts/check-deps.sh

      - name: Check minimal features
        run: cargo check -p airx --no-default-features

      - name: Check wasm32
        run: >
          cargo check
          -p airx
          --target wasm32-unknown-unknown
          --no-default-features
          --features wasm,openai,stream,unified
